apiVersion: apps/v1
kind: Deployment
metadata:
  name: users

spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
  
    spec:
      containers:
        - name: users
          image: monitoringeventticketingplatform-users:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081