server.port=8080
spring.application.name=APIGateway

spring.cloud.gateway.server.webmvc.routes[0].id=users
spring.cloud.gateway.server.webmvc.routes[0].uri=https://users.purplecliff-30d5a74e.germanywestcentral.azurecontainerapps.io
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=events
spring.cloud.gateway.server.webmvc.routes[1].uri=https://events.purplecliff-30d5a74e.germanywestcentral.azurecontainerapps.io
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/events/**

management.endpoints.web.exposure.include=gateway
management.endpoint.gateway.enabled=true

debug=true

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=events-service