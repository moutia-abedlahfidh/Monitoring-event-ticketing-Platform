apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway

spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
  
    spec:
      containers:
        - name: gateway
          image: eventticketingacr2026.azurecr.io/gateway:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080