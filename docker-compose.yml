version: '3.9'

services:

  frontend:
    build:
      context: ./event-ticketing-frontend
    ports:
      - "5173:80"
    #depends_on:
  
  gateway:
    build:
      context: ./event-ticketing-backend/APIGateway
    ports:
      - "8080:8080"
    depends_on:
      - users-service
      - event-service

  event-service:
    build:
      context: ./event-ticketing-backend/ManageEvents
    ports:
      - "8082:8082"
      
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://event-db:5432/events
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=dev
    depends_on:
      - event-db

  users-service:
    build:
      context: ./event-ticketing-backend/users
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://event-db:5432/events
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=dev
    depends_on:
      - event-db

  event-db:
    image : postgres:16-alpine
    environment:
      - POSTGRES_DB=events
      - POSTGRES_PASSWORD=dev
    ports:
      - "5432:5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
  

volumes:
  event-db-data: