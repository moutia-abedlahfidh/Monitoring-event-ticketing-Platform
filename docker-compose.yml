version: '3.9'

services:

  frontend:
    build:
      context: ./event-ticketing-frontend
    ports:
      - "5174:80"
    #depends_on:

  event-service:
    build:
      context: ./event-ticketing-backend/ManageEvents
    ports:
      - "8080:8080"

  event-db:
    image : postgres:16-alpine
    environment:
      - POSTGRES_DB=events
      - POSTGRES_PASSWORD=dev
    ports:
      - "5432:5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
  

volumes:
  event-db-data: